# Websocket listener; TLS is terminated by the reverse proxy in front
# (wss://mqtt.vagarth.dev/mqtt -> HiLight-mosquitto:9001).
listener 9001
protocol websockets

# Plain MQTT for containers on shared_network (e.g. Home Assistant). Not
# published to the host in docker-compose.yml, so it is not reachable from the LAN.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
